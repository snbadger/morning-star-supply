<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Morning Star — Supply Order</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#1a3c5e;--primary-light:#2980b9;--accent:#e67e22;--success:#27ae60;--danger:#e74c3c;--bg:#f0f2f5;--card:#fff;--text:#2c3e50;--text-light:#7f8c8d;--border:#dce1e6;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.header{background:linear-gradient(135deg,#0d2137,var(--primary));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
.header .sub{font-size:11px;opacity:.75;margin-top:2px}
.header .sub a{color:#9ec5e8;text-decoration:none}
.who{font-size:12px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:16px;cursor:pointer;white-space:nowrap}
.page{max-width:620px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
label{display:block;font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px}
input,select{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--primary-light)}
.search-wrap{position:sticky;top:62px;z-index:90;background:var(--bg);padding:10px 0 6px}
#search{font-size:17px;padding:14px;border-radius:12px;border:1.5px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hint{font-size:12.5px;color:var(--text-light);margin-top:7px;line-height:1.5}
.result{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:7px}
.result .d{flex:1;min-width:0}
.result .nm{font-size:13.5px;font-weight:600;line-height:1.3;word-break:break-word}
.result .meta{font-size:11px;color:var(--text-light);margin-top:2px}
.result button{flex:none;border:none;border-radius:8px;font-size:12.5px;font-weight:700;padding:9px 14px;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff}
.result button:disabled{background:#eafaf1;color:var(--success)}
.section-title{font-size:12px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
.req{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:11px 12px;margin-bottom:7px}
.req.done{border-left-color:var(--success);background:#f8fdfa;color:#5d6d63}
.req .d{flex:1;min-width:0}
.req .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.req .meta{font-size:11px;color:var(--text-light);margin-top:2px}
.req .mark{flex:none;border:1.5px solid var(--success);background:#fff;color:var(--success);border-radius:8px;font-size:12px;font-weight:700;padding:8px 12px;cursor:pointer;font-family:inherit}
.req.done .mark{border-color:var(--border);color:var(--text-light)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--text-light);font-size:13.5px;padding:22px 10px;line-height:1.6}
.custom-row{background:#fdf6ec;border:1.5px dashed #e2c99a;border-radius:10px;padding:12px;margin-top:6px}
.custom-row button{margin-top:8px;width:100%;padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
#adminBar{background:#0d2137;color:#fff;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:12.5px;display:none;justify-content:space-between;align-items:center}
#adminBar button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.load{text-align:center;color:var(--text-light);padding:24px;font-size:14px}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📦 Supply Order</h1>
    <div class="sub"><a href="https://snbadger.github.io/morning-star-rounds/">← All Apps</a> · Morning Star Post Acute</div>
  </div>
  <div class="who" id="whoChip" onclick="editIdentity()">Sign in</div>
</div>
<div class="page">
  <div id="adminBar"><span>🛒 Ordering view — tap ✓ when an item is ordered</span><button onclick="exportCSV()">Export CSV</button></div>

  <div id="identityCard" class="card" style="display:none">
    <h2 style="font-size:18px;margin-bottom:4px">Who are you?</h2>
    <div class="hint">So we know who asked for each item.</div>
    <label>Your name</label>
    <input id="iName" placeholder="First and last name" autocomplete="name">
    <label>Where do you work?</label>
    <select id="iDept"></select>
    <div style="height:16px"></div>
    <button class="btn btn-primary" onclick="saveIdentity()">Continue</button>
  </div>

  <div id="mainUI" style="display:none">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="🔍 Search for an item… (briefs, gloves, gauze)" autocomplete="off">
    </div>
    <div id="results"></div>

    <div class="section-title"><span>On the order list</span><span id="openCount"></span></div>
    <div id="openList"><div class="load">Loading…</div></div>

    <div class="section-title" id="orderedTitle" style="display:none"><span>Ordered recently ✓</span></div>
    <div id="orderedList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL='https://pmnudshutxwidxdtouqj.supabase.co';
var SUPABASE_KEY='sb_publishable_wzX5nLx18cfErNTRPO671w_sH4ED7ET';
var sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
var SYNC_URL=SUPABASE_URL+'/functions/v1/supply-asana-sync';
function pingAsana(id){fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:id})}).catch(function(){})}
// Ordering view (mark items off) lives behind #admin — for whoever places the orders.
var ADMIN=/admin/i.test(location.hash)||/[?&]admin/i.test(location.search);

var WORK_DEPTS=["Nursing (CNA)","Nursing (LVN/RN)","Dietary","Housekeeping","Laundry","Maintenance",
"Activities","Social Services","Business Office","Medical Records","Admissions","HR / Staffing",
"Therapy / Rehab","MDS","Staff Education","Administration","Other"];

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var me={name:lsGet('ii_name')||'',dept:lsGet('ii_dept')||''};
var open=[], ordered=[], loaded=false;

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}
function fmt(s){if(!s)return'';var d=new Date(s);return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})}
function whoChip(){document.getElementById('whoChip').textContent=me.name?('👤 '+me.name.split(' ')[0]):'Sign in'}

function editIdentity(){
  var sel=document.getElementById('iDept');
  sel.innerHTML='<option value="">Select your department…</option>'+WORK_DEPTS.map(function(d){
    return '<option value="'+esc(d)+'"'+(me.dept===d?' selected':'')+'>'+esc(d)+'</option>'}).join('');
  document.getElementById('iName').value=me.name;
  document.getElementById('identityCard').style.display='';
  document.getElementById('mainUI').style.display='none';
}
function saveIdentity(){
  var n=document.getElementById('iName').value.trim(), d=document.getElementById('iDept').value;
  if(n.length<3||n.indexOf(' ')<0){toast('Please enter your first and last name');return}
  if(!d){toast('Please pick your department');return}
  me={name:n,dept:d};lsSet('ii_name',n);lsSet('ii_dept',d);
  whoChip();showMain();
}
function showMain(){
  document.getElementById('identityCard').style.display='none';
  document.getElementById('mainUI').style.display='';
  if(ADMIN)document.getElementById('adminBar').style.display='flex';
}

/* ---------- search ---------- */
var searchTimer=null;
document.getElementById('search').addEventListener('input',function(){
  clearTimeout(searchTimer);searchTimer=setTimeout(renderResults,120);
});
function openItemNumbers(){var s={};open.forEach(function(r){if(r.item_number)s[r.item_number]=1});return s}
function renderResults(){
  var q=document.getElementById('search').value.trim().toUpperCase();
  var box=document.getElementById('results');
  if(q.length<2){box.innerHTML='';return}
  var words=q.split(/\s+/);
  var hits=ITEMS.filter(function(it){
    var hay=(it.description+' '+it.itemNumber+' '+it.category+' '+it.location).toUpperCase();
    return words.every(function(w){return hay.indexOf(w)>=0});
  }).slice(0,30);
  var onList=openItemNumbers();
  var h=hits.map(function(it){
    var on=onList[it.itemNumber];
    return '<div class="result"><div class="d"><div class="nm">'+esc(it.description)+'</div>'+
      '<div class="meta">'+esc(it.category)+' · '+esc(it.location)+'</div></div>'+
      '<button '+(on?'disabled':'')+' onclick="addItem(\''+esc(it.itemNumber)+'\')">'+(on?'✓ On list':'+ Add')+'</button></div>';
  }).join('');
  h+='<div class="custom-row"><div class="hint" style="margin:0">Can\'t find it? Add it as a custom item:</div>'+
     '<button onclick="addCustom()">+ Add &ldquo;<span id="customEcho">'+esc(document.getElementById('search').value.trim())+'</span>&rdquo; to the list</button></div>';
  box.innerHTML=h;
}
async function addItem(num){
  var it=ITEMS.find(function(x){return x.itemNumber===num});
  if(!it)return;
  var r=await sb.rpc('submit_supply_request',{p_item_number:it.itemNumber,p_description:it.description,
    p_location:it.location,p_category:it.category,p_by:me.name+' ('+me.dept+')'});
  if(r.error){toast('Could not add — try again');return}
  pingAsana(r.data);
  toast('Added to the order list ✓');
  await loadList();renderResults();
}
async function addCustom(){
  var txt=document.getElementById('search').value.trim();
  if(txt.length<3){toast('Type what you need first');return}
  var r=await sb.rpc('submit_supply_request',{p_item_number:null,p_description:txt,
    p_location:null,p_category:'Custom',p_by:me.name+' ('+me.dept+')'});
  if(r.error){toast('Could not add — try again');return}
  pingAsana(r.data);
  toast('Added to the order list ✓');
  document.getElementById('search').value='';
  await loadList();renderResults();
}

/* ---------- list ---------- */
async function loadList(){
  var since=new Date(Date.now()-1000*60*60*24*14).toISOString();
  var res=await Promise.all([
    sb.from('supply_requests').select('*').eq('status','open').order('created_at',{ascending:false}).limit(200),
    sb.from('supply_requests').select('*').eq('status','ordered').gte('ordered_at',since).order('ordered_at',{ascending:false}).limit(100)
  ]);
  open=res[0].data||[];ordered=res[1].data||[];loaded=true;
  renderList();
  if(document.getElementById('search').value.trim().length>=2)renderResults();
}
function reqRow(r,isOpen){
  return '<div class="req'+(isOpen?'':' done')+'"><div class="d">'+
    '<div class="nm">'+(isOpen?'':'✓ ')+esc(r.description)+'</div>'+
    '<div class="meta">'+(r.category?esc(r.category)+' · ':'')+esc(r.requested_by||'')+' · '+fmt(r.created_at)+
    (isOpen?'':' · ordered '+fmt(r.ordered_at)+(r.ordered_by?' by '+esc(r.ordered_by):''))+'</div></div>'+
    (ADMIN?(isOpen
      ?'<button class="mark" onclick="markOrdered(\''+r.id+'\',false)">✓ Ordered</button>'
      :'<button class="mark" onclick="markOrdered(\''+r.id+'\',true)">Undo</button>'):'')+
    '</div>';
}
function renderList(){
  document.getElementById('openCount').textContent=open.length?open.length+' item'+(open.length>1?'s':''):'';
  document.getElementById('openList').innerHTML=open.length
    ? open.map(function(r){return reqRow(r,true)}).join('')
    : '<div class="empty">Nothing waiting to be ordered. 🎉<br>Search above to add what you need.</div>';
  var ot=document.getElementById('orderedTitle');
  if(ordered.length){ot.style.display='flex';
    document.getElementById('orderedList').innerHTML=ordered.map(function(r){return reqRow(r,false)}).join('');
  }else{ot.style.display='none';document.getElementById('orderedList').innerHTML='';}
}
async function markOrdered(id,undo){
  var r=await sb.rpc('mark_supply_ordered',{p_id:id,p_by:me.name,p_undo:undo});
  if(r.error||r.data!==true){toast('Could not update — try again');return}
  toast(undo?'Moved back to the list':'Marked as ordered ✓');
  await loadList();
}

/* ---------- csv (ordering view) ---------- */
function exportCSV(){
  var csv='Description,Item Number,Category,Location,Requested By,Requested On\n';
  open.forEach(function(r){
    csv+='"'+String(r.description).replace(/"/g,'""')+'","'+(r.item_number||'')+'","'+(r.category||'')+'","'+(r.location||'')+'","'+String(r.requested_by||'').replace(/"/g,'""')+'","'+fmt(r.created_at)+'"\n';
  });
  var a=document.createElement('a');
  a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='supply-order-'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('CSV exported');
}

/* ---------- init ---------- */
whoChip();
if(!sb){document.getElementById('mainUI').innerHTML='<div class="card"><div class="empty">Could not connect. Check your internet and reload.</div></div>';document.getElementById('mainUI').style.display='';}
else{
  if(me.name&&me.dept)showMain();else editIdentity();
  loadList();
}
</script>
